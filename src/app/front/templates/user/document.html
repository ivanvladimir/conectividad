{% extends 'base.html' %}

{% block title %}Sentencia {{sentence_num}}{% endblock %}
{% block extra_links %} 
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs" type="module"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf_viewer.mjs" type="module"></script>
<style>
        .textLayer {
            position: absolute;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            line-height: 1;
            user-select: text;
        }
        .textLayer span {
            color: transparent;
            position: absolute;
            white-space: pre;
            cursor: text;
        }
        .textLayer span:hover {
            opacity: 0.2;
            background: rgba(0, 123, 255, 0.5);
        }
        </style>
{% endblock %}

{% block restricted_content %}

<div hx-post="{{url_for('api_doc',sentence_num=sentence_num)}}"
      hx-trigger="load"
      hx-swap="innerHTML">
</div>

<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto" x-data="pdfViewer()" x-init="loadDefaultPDF()">
        <!-- Main Content -->
        <div class="bg-white p-6 rounded-b-lg shadow-lg">
            <!-- Message -->
            <template x-if="message">
                <div :class="messageType === 'error' ? 'bg-red-100 border border-red-400 text-red-700' : 'bg-green-100 border border-green-400 text-green-700'" class="p-3 rounded mb-4">
                    <span x-text="message"></span>
                </div>
            </template>

            <!-- Canvas Container -->
            <template x-if="loaded">
                <div class="flex justify-center bg-gray-200 rounded-lg p-6 mb-6">
                    <div class="relative inline-block">
                        <div id="textLayer" class="textLayer"></div>
                        <canvas id="pdfCanvas" class="shadow-lg max-w-full h-auto"></canvas>
                        <canvas id="polygonCanvas" class="absolute top-0 left-0 cursor-crosshair" style="display: none;"></canvas>
                    </div>
                </div>
            </template>

            <!-- Page Controls -->
            <template x-if="loaded">
                <div class="flex justify-center items-center gap-6 flex-wrap">
                    <button 
                        @click="previousPage()" 
                        :disabled="pageNum <= 1"
                        class="px-4 py-2 bg-indigo-500 text-white rounded hover:bg-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed transition"
                    >
                        ← Anterior
                    </button>
                    
                    <div class="flex items-center gap-2">
                        <input 
                            type="number" 
                            x-model.number="pageNum" 
                            @change="goToPage()"
                            :min="1"
                            :max="pageCount"
                            class="w-20 px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                        <span class="text-gray-600 font-medium" x-text="` / ${pageCount}`"></span>
                    </div>
                    
                    <button 
                        @click="nextPage()" 
                        :disabled="pageNum >= pageCount"
                        class="px-4 py-2 bg-indigo-500 text-white rounded hover:bg-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed transition"
                    >
                        Siguiente →
                    </button>
                </div>
            </template>
        </div>
    </div>
</div>

{% endblock %}

{% block script %}
<script>
        function initPDF() {
            if (typeof pdfjsLib !== 'undefined') {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs';
            } else if (typeof pdfjs !== 'undefined') {
                pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPDF);
        } else {
            initPDF();
        }

        function pdfViewer() {
            let pdf;
            return {
                loaded: false,
                pageNum: {{page}},
                pageCount: 0,
                loading: false,
                message: '',
                messageType: '',
                fillOpacity: 0.2,
                strokeColor: '#3b82f6',
                polygon: {{polygon|tojson}},

                async loadDefaultPDF() {
                    try {
                      // Load a sample PDF from Mozilla's PDF.js repo
                      const url = '{{url_for("api_pdf", sentence_num=sentence_num)}}';
                      const response = await fetch(url);
                      const arrayBuffer = await response.arrayBuffer();
                      
                      const lib = typeof pdfjsLib !== 'undefined' ? pdfjsLib : pdfjs;
                      pdf = await lib.getDocument(arrayBuffer).promise;

                      this.loaded = true;
                      
                      this.pageCount = pdf.numPages;
                      this.showMessage(`PDF loaded: ${pdf.numPages} pages`, 'success');
                      await this.renderPage(this.pageNum);
                      this.loaded = true;
                    } catch (err) {
                        this.showMessage('Error loading PDF: ' + err.message, 'error');
                        console.error(err);
                    } finally {
                        this.loading = false;
                    }
                },

                async renderPage(pageNum) {
                    
                    this.loading = true;
                    try {
                        const page = await pdf.getPage(pageNum);
                        const scale = 3;
                        const viewport = page.getViewport({ scale });
                        const canvas = document.getElementById('pdfCanvas');
                        const context = canvas.getContext('2d');
                        
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;

                        const renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };


                        await page.render(renderContext).promise;
                        // Draw polygon segments
                        if(this.polygon && this.pageNum === {{page}}){

                          var fact=scale;
                          context.beginPath();
                          context.moveTo(this.polygon[0].x*fact, this.polygon[0].y*fact);
                          
                          for (let i = 1; i < this.polygon.length; i++) {
                              context.lineTo(this.polygon[i].x*fact, this.polygon[i].y*fact);
                          }
                          context.lineTo(this.polygon[0].x*fact, this.polygon[0].y*fact);
                          
                          context.fillStyle = 'rgba(188, 245, 186, 0.2)';
                          context.fill(); 
                          context.strokeStyle = 'rgba(188, 245, 186, 0.5)';
                          context.lineWidth = 2;
                          context.stroke();
                        }


                        const lib = typeof pdfjsLib !== 'undefined' ? pdfjsLib : pdfjs;
                        const textLayerElement = document.getElementById('textLayer');
                        textLayerElement.innerHTML = '';
                        Object.assign(textLayerElement.style, {
                            width: viewport.width + 'px',
                            height: viewport.height + 'px'
                        });              

                        const textContent = await page.getTextContent();

                        const textLayer = new lib.TextLayer({
                          textContentSource: textContent,
                          pageIndex: page.pageNumber,
                          viewport: viewport,
                          container: textLayerElement,
                        });
                        await textLayer.render();

                        this.loading = false;
                    } catch (err) {
                        this.showMessage('Error rendering page: ' + err.message, 'error');
                        console.error(err);
                        this.loading = false;
                    }
                },

                async nextPage() {
                    if (this.pageNum < this.pageCount) {
                        this.pageNum++;
                        await this.renderPage(this.pageNum);
                    }
                },

                async previousPage() {
                    if (this.pageNum > 1) {
                        this.pageNum--;
                        await this.renderPage(this.pageNum);
                    }
                },

                async goToPage() {
                    if (this.pageNum >= 1 && this.pageNum <= this.pageCount) {
                        await this.renderPage(this.pageNum);
                    }
                },

                showMessage(msg, type) {
                    this.message = msg;
                    this.messageType = type;
                    setTimeout(() => {
                        this.message = '';
                    }, 3000);
                }
            };
        }
</script>
{% endblock %}
