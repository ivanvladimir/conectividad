{% extends 'base.html' %}

{% block title %}Sentencia {{sentence_num}}{% endblock %}
{% block extra_links %} 
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.min.mjs" type="module"></script>
{% endblock %}

{% block restricted_content %}

<div hx-post="{{url_for('api_doc',sentence_num=sentence_num)}}"
      hx-trigger="load"
      hx-swap="innerHTML">
</div>

<div class="container" x-data="pdfViewer()" x-init="loadDefaultPDF()">
      <div x-show="message" :class="messageType" class="message">
          <span x-text="message"></span>
      </div>

      <div x-show="loaded" class="canvas-container">
          <canvas id="pdfCanvas"></canvas>
      </div>

      <div x-show="loaded" class="page-controls">
          <button @click="previousPage()" :disabled="pageNum <= 1">← Previous</button>
          <div class="page-info">
              <input 
                  type="number" 
                  x-model.number="pageNum" 
                  @change="goToPage()"
                  :min="1"
                  :max="pageCount"
              >
              <span x-text="` / ${pageCount}`"></span>
          </div>
          <button @click="nextPage()" :disabled="pageNum >= pageCount">Next →</button>
      </div>
</div>

{% endblock %}

{% block script %}
<script>
function initPDF() {
            if (typeof pdfjsLib !== 'undefined') {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs';
            } else if (typeof pdfjs !== 'undefined') {
                pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/pdf.worker.min.mjs';
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPDF);
        } else {
            initPDF();
        }

        function pdfViewer() {
            let pdf;
            return {
                loaded: false,
                pageNum: 1,
                pageCount: 0,
                loading: false,
                message: '',
                messageType: '',

                async loadDefaultPDF() {
                    try {
                        // Load a sample PDF from Mozilla's PDF.js repo
                       const url = '{{url_for("api_pdf", sentence_num=sentence_num)}}';
                        const response = await fetch(url);
                        const arrayBuffer = await response.arrayBuffer();
                        
                        const lib = typeof pdfjsLib !== 'undefined' ? pdfjsLib : pdfjs;
                        pdf = await lib.getDocument(arrayBuffer).promise;

                        this.loaded = true;
                        
                        this.pageCount = pdf.numPages;
                        this.pageNum = 1;
                        this.showMessage(`PDF loaded: ${pdf.numPages} pages`, 'success');
                        await this.renderPage(1);
                        this.loaded = true;
                    } catch (err) {
                        this.showMessage('Error loading PDF: ' + err.message, 'error');
                        console.error(err);
                    } finally {
                        this.loading = false;
                    }
                },

                async renderPage(pageNum) {
                    this.loading = true;
                    try {
                        const page = await pdf.getPage(pageNum);
                        const scale = 1;
                        const viewport = page.getViewport({ scale });
                        const canvas = document.getElementById('pdfCanvas');
                        const context = canvas.getContext('2d');
                        
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;

                        const renderContext = {
                            canvasContext: context,
                            viewport: viewport
                        };

                        await page.render(renderContext).promise;
                        this.loading = false;
                    } catch (err) {
                        this.showMessage('Error rendering page: ' + err.message, 'error');
                        console.error(err);
                        this.loading = false;
                    }
                },

                async nextPage() {
                    if (this.pageNum < this.pageCount) {
                        this.pageNum++;
                        await this.renderPage(this.pageNum);
                    }
                },

                async previousPage() {
                    if (this.pageNum > 1) {
                        this.pageNum--;
                        await this.renderPage(this.pageNum);
                    }
                },

                async goToPage() {
                    if (this.pageNum >= 1 && this.pageNum <= this.pageCount) {
                        await this.renderPage(this.pageNum);
                    }
                },

                showMessage(msg, type) {
                    this.message = msg;
                    this.messageType = type;
                    setTimeout(() => {
                        this.message = '';
                    }, 3000);
                }
            };
        }
</script>
{% endblock %}
