{% extends 'base.html' %}
{% block title %}Gráficas por país{% endblock %}
{% block restricted_content %}
    <div class="container mx-auto max-w-2xl">
      <div 
            x-data="{
                selectedCountry: '',
                isOpen: false,
                countries: window.countries,
                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    this.selectedCountry = urlParams.get('country') || '';
                },
                selectItem(country) {
                    this.selectedCountry = country;
                    const url = new URL(window.location);
                    url.searchParams.set('country', country);
                    window.history.pushState({}, '', url);
                    this.isOpen = false;
                },
                toggle() {
                  this.isOpen = !this.isOpen;
                },
                close(){
                  this.isOpen = false;
                },
                isSelected(country) {
                  return this.selectedCountry === country
                },
            }"
            class="card bg-base-100 shadow-xl"
        >
  
          <div class="dropdown w-full relative">
            <button
              type="button"
              class="btn btn-outline w-full justify-between"
              @click="toggle()"
            >
            <span x-show="!selectedCountry">Selecciona un país</span>
            <span x-show="selectedCountry" class="flex items-center gap-2">
              <span x-text="countries[selectedCountry] ? countries[selectedCountry][0] : ''"></span>
              <span x-text="selectedCountry"></span>
            </span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
            </button>
            <ul
              x-show="isOpen"
              @click.away="close()"
              x-transition:enter="transition ease-out duration-100"
              x-transition:enter-start="transform opacity-0 scale-95"
              x-transition:enter-end="transform opacity-100 scale-100"
              x-transition:leave="transition ease-in duration-75"
              x-transition:leave-start="transform opacity-100 scale-100"
              x-transition:leave-end="transform opacity-0 scale-95"
              class="menu dropdown-content absolute z-[1] p-2 shadow-lg bg-base-100 rounded-box w-full max-h-96 overflow-y-auto flex-nowrap mt-2">
              <template x-for="(data, country) in countries" :key="country">
                <li>
                      <button
                          type="button"
                          :class="{'active': selectedCountry === country}"
                          class="dropdown-item w-full text-left flex items-center gap-2"
                          @click="selectItem(country)"
                      >
                          <span x-text="data[0]" class="text-2xl"></span>
                          <span x-text="country"></span>
                          <span 
                              class="ml-auto w-4 h-4 rounded-full" 
                              :style="'background-color: ' + data[1]"
                          ></span>
                      </button>
                </li>
              </template>
            </ul>
          </div>
          <!-- Navigation Button -->
          <div x-show="selectedCountry" class="mt-4">
              <a 
                  :href="'{{url_for('graph',kind='filtered')}}?country=' + encodeURIComponent(selectedCountry)"
                  class="btn btn-primary w-full"
              >
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                  </svg>
                  Dibujar gráfo
              </a>
          </div>
      </div>
    </div>
{% endblock %}
